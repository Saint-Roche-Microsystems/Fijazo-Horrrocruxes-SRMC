[project]
# Ya no hay aplicación en la raíz: el monolito se retiró al completarse la migración y
# cada dominio vive en su propio submódulo, con su pyproject y sus dependencias.
# Este proyecto sólo sostiene el utillaje del repo maestro:
#   - scripts/backfill_progression.py (carga inicial de progresión)
#   - tests-integration/ (tests que cruzan varios servicios)
name = "fijazo-tooling"
version = "0.1.0"
description = "Utillaje del repo maestro de Fijazo: scripts de operación y tests de integración"
authors = [
    {name = "gomiiDev",email = "carlosha176@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "httpx (>=0.28.1,<0.29.0)",
    "aio-pika (>=9.5.0,<10.0.0)"
]

[tool.poetry]
# Sin paquete propio: aquí no hay código de aplicación que instalar.
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.15.21,<0.16.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# `tests-integration/` necesita los contenedores levantados, así que un `pytest` pelado no
# debe arrancarlo por accidente. El `--ignore` lo excluye del descubrimiento automático,
# pero NO cuando se pasa la ruta explícitamente (`pytest tests-integration/`), que es la
# forma documentada de correrlo. Los submódulos tienen su propio entorno y suite.
addopts = "--ignore=tests-integration"
norecursedirs = ["auth-service", "users-service", "bets-service", "progression-service", "api-gateway"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
